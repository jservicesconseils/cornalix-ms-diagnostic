# Profil "prod" (SCRUM-35) : active via SPRING_PROFILES_ACTIVE=prod sur
# la tache ECS (SCRUM-36). Remplace uniquement la source de donnees H2
# de application.yml par la vraie instance RDS Postgres -- tout le reste
# (securite Cognito, CORS, actuator) reste identique entre les deux
# profils et n'a pas besoin d'etre redefini ici.
#
# DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/DB_PASSWORD sont fournis a la tache
# ECS a partir de SSM Parameter Store (/cornalix/prod/rds/*, voir
# infra/prod/platform/database.tf sur cornalix-ms-identity) -- meme
# instance RDS partagee avec cornalix-ms-identity (une seule base
# logique "cornalix", voir decision SCRUM-35), jamais codes en dur ici.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    # SCRUM-50 : Hibernate ne modifie plus lui-meme le schema -- il verifie
    # seulement qu'il correspond aux entites au demarrage (validate echoue
    # fort et bloque le demarrage plutot que de modifier silencieusement
    # une base avec des donnees, comme update le faisait). Toute evolution
    # d'entite passe desormais par une nouvelle migration Flyway versionnee.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  # SCRUM-50 : la base dev/prod existe deja (questions, answers,
  # answer_history deja peuples) -- baseline-version=1 (= V1__baseline.sql,
  # qui recree ce meme schema) fait que Flyway marque la base existante
  # comme deja a la version 1 au premier demarrage SANS rejouer ce script,
  # au lieu d'echouer sur des "relation already exists". Seules les
  # migrations futures (V2+) s'executeront reellement contre cette base.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
